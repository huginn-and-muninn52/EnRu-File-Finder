name: IntelliJ Platform Plugin Compatibility

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: Verify plugin compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the plugin
        run: ./gradlew buildPlugin

      - name: Verify Plugin on IntelliJ Platforms
        id: verify
        uses: ChrisCarini/intellij-platform-plugin-verifier-action@v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ide-versions: |
            ideaIU:2025.2
            ideaIU:LATEST-EAP-SNAPSHOT
          failure-levels: |
            COMPATIBILITY_PROBLEMS
            INVALID_PLUGIN
            DEPRECATED_API_USAGES

      - name: Print verifier log
        run: |
          echo "Verifier log [${{ steps.verify.outputs.verification-output-log-filename }}]:"
          cat "${{ steps.verify.outputs.verification-output-log-filename }}"